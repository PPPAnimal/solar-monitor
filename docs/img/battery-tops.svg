<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" role="img" aria-label="Top view of the four batteries. Negative posts are on the wall side with the shunt on battery 4. Positive posts are on the room side, and both positive cables land on battery 1.">
<style><![CDATA[
/* Layout: a shop drawing sheet. One wide scaled drawing first, then the battery-top plan, then cable and check lists. */
:root {
  --bg: #eef1f0;
  --panel: #fbfcfc;
  --ink: #1b2a30;
  --muted: #5a6b72;
  --line: #c3cdd0;
  --stud: #dfe5e4;
  --wood: #e9dcc0;
  --batt: #d5dbdd;
  --ctrl: #1f6fb5;
  --on-ctrl: #ffffff;
  --pos: #c8322b;
  --neg: #26343a;
  --pv: #b77a00;
  --brass: #c79a2e;
  --sig: #6b4fa8;
  --sense: #0f7d74;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141c20; --panel: #1c272c; --ink: #e3eaec; --muted: #9aabb1; --line: #38474d;
    --stud: #222e33; --wood: #4a4234; --batt: #35434a; --ctrl: #3d8fd6; --on-ctrl: #ffffff;
    --pos: #ee6a60; --neg: #c9d4d8; --pv: #e3ab3a; --brass: #d8b04f; --sig: #b39cf0; --sense: #4cc9bd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141c20; --panel: #1c272c; --ink: #e3eaec; --muted: #9aabb1; --line: #38474d;
  --stud: #222e33; --wood: #4a4234; --batt: #35434a; --ctrl: #3d8fd6; --on-ctrl: #ffffff;
  --pos: #ee6a60; --neg: #c9d4d8; --pv: #e3ab3a; --brass: #d8b04f; --sig: #b39cf0; --sense: #4cc9bd;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.sheet { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-direction: column; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 2.3rem; line-height: 1.05; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.45rem; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
p { margin: 0; max-width: 65ch; }
.sub { color: var(--muted); }
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
figure { margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.draw { background: var(--panel); border: 1px solid var(--line); overflow-x: auto; }
.draw svg { display: block; height: auto; color: var(--ink); }
.draw svg.wide { width: 100%; min-width: 780px; }
.draw svg.plan { width: 100%; min-width: 540px; max-width: 720px; margin: 0 auto; }
figcaption { color: var(--muted); font-size: 0.95rem; max-width: 70ch; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 0.9rem; color: var(--muted); list-style: none; padding: 0; margin: 0; }
.legend li { display: flex; align-items: center; gap: 8px; }
.sw { display: inline-block; width: 26px; height: 0; border-top: 4px solid var(--neg); }
.sw.pos { border-color: var(--pos); } .sw.pv { border-color: var(--pv); border-top-width: 2px; } .sw.thin { border-top-width: 2px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 0.95rem; }
th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--display); font-weight: 600; font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
ul.checks { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 70ch; }

/* drawing marks */
svg text { font-family: var(--body); font-size: 11.5px; fill: currentColor; }
svg text.dim { font-family: var(--mono); font-size: 11px; }
svg text.vt { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
svg text.small { font-size: 10px; }
svg text.onctrl { fill: var(--on-ctrl); font-weight: 600; }
svg text.pm { font-size: 14px; font-weight: 600; }
.stud { fill: var(--stud); }
.board { fill: var(--wood); stroke: currentColor; stroke-width: 1; }
.batt { fill: var(--batt); stroke: currentColor; stroke-width: 1; }
.frame { fill: var(--panel); stroke: currentColor; stroke-width: 1; }
.box { fill: var(--panel); stroke: currentColor; stroke-width: 1.2; }
.ctrl { fill: var(--ctrl); stroke: currentColor; stroke-width: 1; }
.brass { fill: var(--brass); stroke: currentColor; stroke-width: 0.8; }
.ppos { fill: var(--pos); } .pneg { fill: var(--neg); } .pn { fill: var(--muted); }
.wall { stroke: currentColor; stroke-width: 2.5; fill: none; }
.thinline { stroke: currentColor; stroke-width: 1; fill: none; }
.lead { stroke: var(--muted); stroke-width: 0.8; fill: none; }
.cpos { stroke: var(--pos); fill: none; stroke-width: 4.5; stroke-linecap: round; }
.cneg { stroke: var(--neg); fill: none; stroke-width: 4.5; stroke-linecap: round; }
.cpv { stroke: var(--pv); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.t { stroke-width: 2.4; }
.csig { stroke: var(--sig); fill: none; stroke-width: 2.2; stroke-linecap: round; }
.csense { stroke: var(--sense); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.jn { fill: var(--pos); }
.draw svg.wire { width: 100%; min-width: 760px; }
.screw { fill: var(--panel); stroke: currentColor; stroke-width: 1; }

svg{color:var(--ink);font-family:var(--body)}
]]></style>
<rect width="100%" height="100%" fill="var(--panel)"/>
          <text class="small" x="110" y="60" style="letter-spacing:0.08em">WALL SIDE</text>
          <text class="small" x="446" y="244" text-anchor="end" style="letter-spacing:0.08em">ROOM SIDE</text>
          <text x="100" y="151" text-anchor="end">corner</text>
          <text x="456" y="151">door</text>

          <rect class="batt" x="110" y="70" width="84" height="154"/>
          <rect class="batt" x="194" y="70" width="84" height="154"/>
          <rect class="batt" x="278" y="70" width="84" height="154"/>
          <rect class="batt" x="362" y="70" width="84" height="154"/>
          <text x="152" y="151" text-anchor="middle">B1</text><text x="236" y="151" text-anchor="middle">B2</text>
          <text x="320" y="151" text-anchor="middle">B3</text><text x="404" y="151" text-anchor="middle">B4</text>

          <line class="cneg" x1="152" y1="91" x2="404" y2="91"/>
          <line class="cpos" x1="152" y1="203" x2="404" y2="203"/>
          <rect class="brass" x="355" y="83" width="57" height="16"/>
          <circle class="pneg" cx="152" cy="91" r="7"/><circle class="pneg" cx="236" cy="91" r="7"/>
          <circle class="pneg" cx="320" cy="91" r="7"/><circle class="pneg" cx="404" cy="91" r="5"/>
          <circle class="ppos" cx="152" cy="203" r="7"/><circle class="ppos" cx="236" cy="203" r="7"/>
          <circle class="ppos" cx="320" cy="203" r="7"/><circle class="ppos" cx="404" cy="203" r="7"/>
          <circle class="pneg" cx="362" cy="91" r="4"/>
          <text class="pm" x="124" y="96" text-anchor="middle">−</text>
          <text class="pm" x="124" y="208" text-anchor="middle">+</text>

          <line class="lead" x1="362" y1="83" x2="362" y2="42"/>
          <text x="446" y="34" text-anchor="end">shunt free bolt: inverter − and controller −</text>
          <line class="lead" x1="152" y1="210" x2="152" y2="256"/>
          <text x="110" y="272">B1 +: inverter + (fused) and controller +</text>
        </svg>
